<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="3;url=https://bitcoiniciantes.github.io/estudebitcoin/">
  <meta name="description" content="Acesse a página Estude Bitcoin e comece sua jornada de aprendizado.">
  <title>Estude Bitcoin | Bitcoin Iniciantes</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <style>
    :root {
      color-scheme: light;
      --bitcoin: #f7931a;
      --bitcoin-dark: #d87908;
      --ink: #171717;
      --muted: #666;
      --line: #e9e9e9;
      --surface: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #fff;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 35%, rgba(247, 147, 26, 0.08), transparent 34%),
        #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 620px);
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 44px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--bitcoin);
      font-family: Georgia, serif;
      font-size: 24px;
      line-height: 1;
      box-shadow: 0 8px 20px rgba(247, 147, 26, 0.22);
    }

    .brand span:last-child {
      color: var(--bitcoin);
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--bitcoin-dark);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 72px);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .description {
      max-width: 500px;
      margin: 24px auto 18px;
      color: var(--muted);
      font-size: clamp(17px, 3vw, 20px);
      line-height: 1.6;
    }

    .countdown {
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: 15px;
    }

    .countdown strong {
      display: inline-grid;
      min-width: 30px;
      height: 30px;
      place-items: center;
      margin: 0 4px;
      border-radius: 50%;
      color: var(--bitcoin-dark);
      background: rgba(247, 147, 26, 0.1);
      font-size: 16px;
    }
    .button {
      display: inline-flex;
      min-height: 56px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 28px;
      border: 1px solid var(--bitcoin);
      border-radius: 999px;
      color: #fff;
      background: var(--bitcoin);
      box-shadow: 0 12px 28px rgba(247, 147, 26, 0.25);
      font-size: 16px;
      font-weight: 750;
      text-decoration: none;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .button::after {
      content: "→";
      font-size: 21px;
      transition: transform 160ms ease;
    }

    .button:hover {
      background: var(--bitcoin-dark);
      box-shadow: 0 16px 34px rgba(247, 147, 26, 0.3);
      transform: translateY(-2px);
    }

    .button:hover::after {
      transform: translateX(3px);
    }

    .button:focus-visible {
      outline: 3px solid rgba(247, 147, 26, 0.3);
      outline-offset: 4px;
    }

    footer {
      margin-top: 64px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: #888;
      font-size: 13px;
    }

    @media (prefers-reduced-motion: reduce) {
      .button,
      .button::after {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="Bitcoin Iniciantes">
      <span class="brand-mark" aria-hidden="true">₿</span>
      <span>Bitcoin <span>Iniciantes</span></span>
    </div>

    <p class="eyebrow">Conhecimento para sua jornada</p>
    <h1>Estude Bitcoin</h1>
    <p class="description">
      Conteúdo claro e direto para você compreender o Bitcoin e avançar com mais autonomia e segurança.
    </p>

    <p class="countdown" aria-live="polite">
      Redirecionando em <strong id="countdown">3</strong> segundos…
    </p>
    <a
      class="button"
      href="https://bitcoiniciantes.github.io/estudebitcoin/"
      aria-label="Acessar o site Estude Bitcoin"
    >
      Acessar Estude Bitcoin
    </a>

    <footer>Bitcoin Iniciantes · Educação e soberania financeira</footer>
  </main>
  <script>
    const destination = "https://bitcoiniciantes.github.io/estudebitcoin/";
    const countdown = document.getElementById("countdown");
    let seconds = 3;

    const timer = window.setInterval(() => {
      seconds -= 1;
      countdown.textContent = seconds;

      if (seconds === 0) {
        window.clearInterval(timer);
        window.location.replace(destination);
      }
    }, 1000);
  </script></body>
</html>
